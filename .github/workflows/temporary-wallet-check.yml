name: temporary-wallet-check
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Crew for wallet
        env:
          WALLET: 6p5qiitHPQN3iK5boUAxCXdYoZQCoBY1UdBKgT4jZfNY
        run: |
          python - <<'PY'
          import json, os, urllib.request

          wallet = os.environ["WALLET"]
          rpc = "https://solana-mainnet.g.alchemy.com/v2/docs-demo"

          payload = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "getAssetsByOwner",
              "params": {
                  "ownerAddress": wallet,
                  "page": 1,
                  "limit": 1000,
                  "displayOptions": {
                      "showFungible": False,
                      "showZeroBalance": False,
                  },
              },
          }

          req = urllib.request.Request(
              rpc,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=45) as r:
              result = json.load(r)

          assets = result.get("result", {}).get("items", [])
          print("DAS assets:", len(assets))

          with urllib.request.urlopen(
              "https://galaxy.staratlas.com/crew", timeout=45
          ) as r:
              crew_rows = json.load(r)

          by_mint = {
              str(row.get("dasID", "")): row
              for row in crew_rows
              if row.get("dasID")
          }

          found = []
          for asset in assets:
              mint = str(asset.get("id", ""))
              if mint in by_mint:
                  row = by_mint[mint]
                  found.append({
                      "mint": mint,
                      "name": row.get("name", ""),
                      "species": row.get("species", ""),
                      "rarity": row.get("rarity", ""),
                      "O": row.get("openness"),
                      "C": row.get("conscientiousness"),
                      "E": row.get("extraversion"),
                      "A": row.get("agreeableness"),
                      "N": row.get("neuroticism"),
                  })

          print(json.dumps(found, ensure_ascii=False, indent=2))
          print("CREW_COUNT=", len(found))
          PY
